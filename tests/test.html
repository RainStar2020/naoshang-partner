<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>升级模块（已抠出）</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070707;
        font-family:
          "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
      }
      /*========== ① 升级模块主体 ==========*/
      .upgrade-module {
        position: relative;
        width: 640px;
        height: 266px;
      }
      /*---------- ② 白色模块：升级前（渐变底 + 右侧凹口） ----------*/
      .card-before {
        position: absolute;
        left: 0;
        top: 38px;
        width: 288px;
        height: 228px;
        z-index: 1;
        border-radius: 24px;
        /* 渐变：左上高光 + 自上而下加深的暖米色 */
        background:
          radial-gradient(
            130% 100% at 20% 0%,
            rgba(255, 255, 255, 0.75) 0%,
            rgba(255, 255, 255, 0) 55%
          ),
          linear-gradient(
            170deg,
            #fef8ea 0%,
            #f9ecd3 42%,
            #f2ddb4 78%,
            #efd7a9 100%
          );
        /* 右侧小凹口：圆形挖空（圆心 x/y、半径 42 可按需调整，坐标相对本卡片） */
        -webkit-mask: radial-gradient(
          circle 42px at 300px 180px,
          transparent 41px,
          #000 42px
        );
        mask: radial-gradient(
          circle 42px at 300px 180px,
          transparent 41px,
          #000 42px
        );
      }
      .tab {
        position: absolute;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .tab-before {
        left: 80px;
        width: 128px;
        height: 52px;
        border-radius: 0 0 16px 16px;
        background: linear-gradient(180deg, #faead0, #f3d7aa);
        color: #c2742e;
        font-size: 28px;
      }
      .title-before {
        position: absolute;
        top: 74px;
        left: 0;
        width: 288px;
        text-align: center;
        font-size: 42px;
        font-weight: 800;
        line-height: 1;
        color: #a85c22;
        letter-spacing: 2px;
      }
      .dashed {
        position: absolute;
        height: 3px;
        border-radius: 2px;
        background-image: repeating-linear-gradient(
          90deg,
          currentColor 0 10px,
          transparent 10px 19px
        );
      }
      .dashed-before {
        top: 158px;
        left: 40px;
        width: 204px;
        color: #e2c69a;
      }
      .dashed-after {
        top: 195px;
        left: 50px;
        right: 44px;
        color: #6e5b44;
      }
      /*---------- ③ 黑色模块：升级后（SVG：圆角 + 左侧凹口 + 金边） ----------*/
      .card-after {
        position: absolute;
        left: 286px;
        top: 0;
        width: 354px;
        height: 266px;
        z-index: 2;
      }
      .card-after svg {
        display: block;
      }
      .card-after-content {
        position: absolute;
        inset: 0;
      }
      .tab-after {
        left: 103px;
        width: 148px;
        height: 62px;
        border-radius: 0 0 18px 18px;
        background: linear-gradient(180deg, #f9e2b2, #e9c283);
        color: #7a4a1e;
        font-size: 30px;
      }
      .title-after {
        position: absolute;
        top: 104px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 46px;
        font-weight: 800;
        line-height: 1;
        color: #fff5e4;
        letter-spacing: 2px;
      }
      /*---------- ④ 中间箭头（含光晕） ----------*/
      .arrow-glow {
        position: absolute;
        left: 183px;
        top: 115px;
        width: 210px;
        height: 200px;
        z-index: 3;
        pointer-events: none;
        background: radial-gradient(
          closest-side,
          rgba(255, 244, 222, 0.95) 0%,
          rgba(255, 244, 222, 0.5) 48%,
          rgba(255, 244, 222, 0) 74%
        );
      }
      .arrow {
        position: absolute;
        left: 234px;
        top: 158px;
        width: 100px;
        height: 125px;
        z-index: 4;
        filter: drop-shadow(0 6px 14px rgba(238, 130, 50, 0.45));
      }
      /*---------- ⑤ 已抠出的独立文字图层：n项会员权益 ----------*/
      .benefits {
        position: absolute;
        top: 220px;
        transform: translateX(-50%);
        white-space: nowrap;
        z-index: 5;
        font-size: 30px;
      }
      .benefits em {
        font-style: normal;
      }
      .benefits-before {
        left: 144px;
        color: #e08634;
        font-weight: 700;
      }
      .benefits-after {
        left: 463px;
        color: #dabc8e;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="upgrade-module">
      <!-- ② 白色模块（标题已扣除"合伙人"） -->
      <section class="card-before">
        <span class="tab tab-before">升级前</span>
        <h3 class="title-before">私董</h3>
        <!-- 原文"私董合伙人" -->
        <i class="dashed dashed-before"></i>
      </section>
      <!-- ③ 黑色模块（标题已扣除"合伙人"） -->
      <section class="card-after">
        <svg viewBox="0 0 354 266" width="354" height="266">
          <defs>
            <radialGradient id="bgAfter" cx="50%" cy="0" r="130%">
              <stop offset="0" stop-color="#43331F" />
              <stop offset=".38" stop-color="#2A1F12" />
              <stop offset=".75" stop-color="#18110A" />
              <stop offset="1" stop-color="#100B06" />
            </radialGradient>
            <linearGradient id="borderAfter" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#EBCB95" />
              <stop offset=".5" stop-color="#C79E65" />
              <stop offset="1" stop-color="#A87F4A" />
            </linearGradient>
          </defs>
          <!-- 左侧凹口 = 路径中 A47 47 那段圆弧（圆心 x=-6,y=196），改半径即可调大小 -->
          <path
            d="M26 0 H328 A26 26 0 0 1 354 26 V246 A20 20 0 0 1 334 266 H26 A20 20 0 0 1 0 246 V242.6 A47 47 0 0 0 0 149.4 V26 A26 26 0 0 1 26 0 Z"
            fill="url(#bgAfter)"
            stroke="url(#borderAfter)"
            stroke-width="2"
          />
        </svg>
        <div class="card-after-content">
          <span class="tab tab-after">升级后</span>
          <h3 class="title-after">联创</h3>
          <!-- 原文"联创合伙人" -->
          <i class="dashed dashed-after"></i>
        </div>
      </section>
      <!-- ④ 箭头 -->
      <div class="arrow-glow"></div>
      <svg class="arrow" viewBox="0 0 96 120">
        <defs>
          <linearGradient id="arrowGrad" x1="0" y1="1" x2=".6" y2="0">
            <stop offset="0" stop-color="#FACD9C" />
            <stop offset=".45" stop-color="#F5A75F" />
            <stop offset="1" stop-color="#ED8033" />
          </linearGradient>
        </defs>
        <path
          d="M58 2 L94 42 L74 42 C74 66 68 84 52 97 C42 105 28 111 10 115 C22 99 30 84 34 66 C36 58 37 50 37 42 L24 42 Z"
          fill="url(#arrowGrad)"
        />
      </svg>
      <!-- ⑤ 已抠出的文字图层（独立元素，可自由移动/改数字/删除） -->
      <p class="benefits benefits-before"><em>6</em>项会员权益</p>
      <p class="benefits benefits-after"><em>12</em>项会员权益</p>
    </div>
  </body>
</html>
